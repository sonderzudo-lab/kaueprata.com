<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1012">
<script>
(() => {
  try {
    if (localStorage.getItem('kp-theme') === 'light') {
      document.documentElement.dataset.theme = 'light';
      document.documentElement.style.colorScheme = 'light';
      document.querySelector('meta[name="theme-color"]').content = '#F2EFE8';
    }
  } catch (e) {}
})();
</script>
<style>html{background:#0F1012}html[data-theme="light"]{background:#F2EFE8}</style>
<title>404 | Kauê Prata</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preload" href="/assets/v2/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/v5/site.css?v=4">
</head>
<body class="notfound">
<button class="theme-toggle notfound-theme" type="button" data-theme-toggle aria-label="Switch to light theme" aria-pressed="false">
  <span class="theme-icon theme-icon-moon" aria-hidden="true"></span>
  <span class="theme-icon theme-icon-sun" aria-hidden="true"></span>
</button>
<main>
  <p class="kicker">// 404</p>
  <h1>404</h1>
  <p class="notfound-line" data-i18n="line">This page does not exist.</p>
  <a class="notfound-back" href="/" data-i18n="back">← back to the homepage</a>
</main>

<script src="/assets/v5/site.js?v=3" defer></script>
<script>
// segue a mesma preferencia das outras paginas, sem redirecionar ninguem
(() => {
  'use strict';
  const PT = { line: "Esta página não existe.", back: "← voltar para a home" };
  let saved = null;
  try { saved = localStorage.getItem('kp-lang'); } catch (e) {}
  const pt = saved ? saved === 'pt' : (navigator.language || 'en').toLowerCase().startsWith('pt');
  if (!pt) return;
  document.documentElement.lang = 'pt-BR';
  document.querySelector('[data-i18n="back"]').href = '/pt/';
  document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = PT[n.dataset.i18n]; });
})();
</script>
</body>
</html>
